<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winners | Selfie with Parent</title>
  <meta name="description" content="Hall of Fame — the winning selfies and stories of the Selfie with Parent campaign, year by year.">
  <!-- Share previews (WhatsApp, Facebook, X) + icons -->
  <link rel="canonical" href="https://www.selfiewithparent.org/winners.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Selfie with Parent">
  <meta property="og:title" content="Winners | Selfie with Parent">
  <meta property="og:description" content="Hall of Fame — the winning selfies and stories of the Selfie with Parent campaign, year by year.">
  <meta property="og:url" content="https://www.selfiewithparent.org/winners.html">
  <meta property="og:image" content="https://www.selfiewithparent.org/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Selfie with Parent — They held your hand first. Now hold the camera.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a3d3e">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/i18n.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/lang.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="stylesheet" href="css/winners.css">
</head>
<body>

  <div id="siteHeader"></div>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <!-- Page banner -->
  <header class="page-banner">
    <div class="container text-center text-white">
      <span class="eyebrow">Celebrating our community</span>
      <h1>Hall of Fame</h1>
      <p class="lead mx-auto">Every year we honour the selfies and stories that best show what it means to cherish a parent.</p>
    </div>
  </header>

  <!-- Toolbar: year tabs + search -->
  <section class="winners-toolbar">
    <div class="container">
      <div class="toolbar-card">
        <div class="year-tabs" id="yearTabs" role="tablist" aria-label="Filter by year"></div>
        <div class="search-wrap">
          <i class="bi bi-search"></i>
          <input type="search" id="winnerSearch" class="form-control" placeholder="Search name, campaign or country" aria-label="Search winners">
        </div>
      </div>
    </div>
  </section>

  <main class="section pt-4" id="winnersRoot" aria-live="polite"></main>

  <!-- Detail modal -->
  <div class="modal fade" id="winnerModal" tabindex="-1" aria-labelledby="wmName" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content winner-modal">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="row g-0">
          <div class="col-md-6"><img id="wmPhoto" alt="" class="w-100 h-100 wm-photo"></div>
          <div class="col-md-6 p-4">
            <span class="rank-pill" id="wmRank"></span>
            <h3 id="wmName" class="mt-2"></h3>
            <ul class="meta-list" id="wmMeta"></ul>
            <p id="wmStory" class="text-muted"></p>
            <div class="share-row" id="wmShare"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap"><div id="copyToast" class="toast align-items-center" role="status" aria-live="polite"><div class="toast-body">Link copied</div></div></div>

  <footer class="site-footer">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between gap-2 small">
        <span>&copy; <span id="year"></span> Selfie with Parent. All rights reserved.</span>
        <span><a href="privacy.html">Privacy Policy</a> · <a href="#">Terms &amp; Conditions</a></span>
      </div>
    </div>
  </footer>

  <a href="#" class="back-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/winners-data.js"></script>
  <script src="js/winners.js"></script>
</body>
</html>
