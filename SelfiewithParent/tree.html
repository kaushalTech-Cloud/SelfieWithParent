<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Tree | Selfie with Parent</title>
  <meta name="description" content="Build a three-generation family tree with photos and download it as an image.">
  <!-- Share previews (WhatsApp, Facebook, X) + icons -->
  <link rel="canonical" href="https://www.selfiewithparent.org/tree.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Selfie with Parent">
  <meta property="og:title" content="Family Tree | Selfie with Parent">
  <meta property="og:description" content="Build a three-generation family tree with photos and download it as an image.">
  <meta property="og:url" content="https://www.selfiewithparent.org/tree.html">
  <meta property="og:image" content="https://www.selfiewithparent.org/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Selfie with Parent — They held your hand first. Now hold the camera.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a3d3e">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/i18n.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/lang.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="stylesheet" href="css/features.css">
</head>
<body>

  <div id="siteHeader"></div>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <header class="page-hero">
    <div class="container">
      <span class="eyebrow">Three generations, one picture</span>
      <h1>Build your <em>family tree</em></h1>
      <p class="lead">Add names and photos for your grandparents, parents and you. Download it to print, frame or share with family.</p>
    </div>
  </header>

  <main class="pb-5">
    <div class="container">
      <div class="tree-wrap lift">
        <form class="card-soft tree-form" id="treeForm" onsubmit="return false">
          <span class="design-flag mb-2"><i class="bi bi-brush"></i> Design preview</span>
          <label class="form-label fw-semibold mt-2 d-block" for="familyTitle">Family name</label>
          <input class="form-control mb-3" id="familyTitle" type="text" maxlength="40" placeholder="e.g. The Sharma family">
          <div id="members"></div>
          <p class="small text-muted mb-0 mt-2"><i class="bi bi-shield-lock"></i> Photos stay on your device.</p>
        </form>
        <div class="tree-canvas-wrap">
          <canvas id="treeCanvas" width="1600" height="1200" aria-label="Family tree preview"></canvas>
          <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
            <button class="btn btn-accent" type="button" id="treeDownload"><i class="bi bi-download"></i> Download tree</button>
            <button class="btn btn-outline-accent" type="button" id="treeReset"><i class="bi bi-arrow-counterclockwise"></i> Start again</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between gap-2 small">
        <span>&copy; <span id="year"></span> Selfie with Parent. All rights reserved.</span>
        <span><a href="privacy.html">Privacy Policy</a> · <a href="#">Terms &amp; Conditions</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/features-data.js"></script>
  <script src="js/features.js"></script>
  <script src="js/tree.js"></script>
</body>
</html>
